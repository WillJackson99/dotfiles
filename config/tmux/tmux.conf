# ─── Atomic (oh-my-posh) inspired tmux theme ──────────────────────────────
# Palette lifted from ~/Documents/config/atomic.omp.json

# True colour so the hex values render correctly
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Status bar at the top
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=default,fg=#e0f8ff"
set -g status-left-length 120
set -g status-right-length 120

# ── Left: ╭─ shell/session ▸ (root-red when prefix held) ▸ path ▸ git ▸ command
set -g status-left "\
#[fg=#0077c2,bg=default]╭─#[fg=#ffffff,bg=#0077c2] #S \
#{?client_prefix,#[fg=#0077c2#,bg=#ef5350]#[fg=#FFFB38#,bg=#ef5350]  #[fg=#ef5350#,bg=#FF9248],#[fg=#0077c2#,bg=#FF9248]}\
#[fg=#2d3436,bg=#FF9248]  #{s|^$HOME|~|:pane_current_path} \
#(~/.config/tmux/scripts/git.zsh '#{pane_current_path}')\
#[fg=#ffffff,bg=#83769c]  #{pane_current_command} \
#[fg=#83769c,bg=default] "

# ── Centre: windows as rounded pills
set -g window-status-separator " "
set -g window-status-format "\
#[fg=#303030,bg=default]#[fg=#b2bec3,bg=#303030]#I #W#{?window_zoomed_flag, ,}\
#[fg=#303030,bg=default]"
set -g window-status-current-format "\
#[fg=#21c7c7,bg=default]#[fg=#011627,bg=#21c7c7,bold]#I #W#{?window_zoomed_flag, ,}\
#[fg=#21c7c7,bg=default,nobold]"
set -g window-status-activity-style "fg=#ef5350"

# ── Right: os ◂ battery ◂ date/time
set -g status-right "\
#[fg=#b2bec3,bg=default]#[fg=#222222,bg=#b2bec3]  \
#(~/.config/tmux/scripts/battery.zsh)\
#[fg=#ffffff,bg=#40c4ff]  %e,%H:%M \
#[fg=#40c4ff,bg=default]"

# ── Panes & messages
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#21c7c7"
set -g display-panes-active-colour "#21c7c7"
set -g display-panes-colour "#83769c"
set -g message-style "fg=#011627,bg=#FFFB38"
set -g message-command-style "fg=#ffffff,bg=#83769c"
set -g mode-style "fg=#011627,bg=#C792EA"
set -g clock-mode-colour "#40c4ff"
