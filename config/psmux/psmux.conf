# Atomic (oh-my-posh) inspired psmux theme - the Windows counterpart of
# config/tmux/tmux.conf. Kept separate because psmux does not document
# #(command) status segments or \u escapes, so this one sticks to built-in
# formats (no live git/battery segments) and uses literal Nerd Font glyphs.
# Note: psmux treats trailing comments as part of a value, so keep comments
# on their own lines.

# Status bar at the top
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=default,fg=#e0f8ff"
set -g status-left-length 120
set -g status-right-length 80

# Left: session, red root segment while prefix is held, path, running command
set -g status-left "#[fg=#0077c2,bg=default]╭─#[fg=#ffffff,bg=#0077c2] #S #{?client_prefix,#[fg=#0077c2#,bg=#ef5350]#[fg=#FFFB38#,bg=#ef5350]  #[fg=#ef5350#,bg=#FF9248],#[fg=#0077c2#,bg=#FF9248]}#[fg=#2d3436,bg=#FF9248]  #{pane_current_path} #[fg=#FF9248,bg=#83769c]#[fg=#ffffff,bg=#83769c]  #{pane_current_command} #[fg=#83769c,bg=default] "

# Centre: windows as rounded pills
set -g window-status-separator " "
set -g window-status-format "#[fg=#303030,bg=default]#[fg=#b2bec3,bg=#303030]#I #W#{?window_zoomed_flag, ,}#[fg=#303030,bg=default]"
set -g window-status-current-format "#[fg=#21c7c7,bg=default]#[fg=#011627,bg=#21c7c7,bold]#I #W#{?window_zoomed_flag, ,}#[fg=#21c7c7,bg=default,nobold]"
set -g window-status-activity-style "fg=#ef5350"

# Right: os, date/time
set -g status-right "#[fg=#b2bec3,bg=default]#[fg=#222222,bg=#b2bec3]  #[fg=#40c4ff,bg=#b2bec3]#[fg=#ffffff,bg=#40c4ff]  %e,%H:%M #[fg=#40c4ff,bg=default]"

# Panes & messages
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#21c7c7"
set -g display-panes-active-colour "#21c7c7"
set -g display-panes-colour "#83769c"
set -g message-style "fg=#011627,bg=#FFFB38"
set -g message-command-style "fg=#ffffff,bg=#83769c"
set -g mode-style "fg=#011627,bg=#C792EA"
set -g clock-mode-colour "#40c4ff"
